# tokenrouter configuration. Paths are relative to this file's directory's parent
# (the project root) unless absolute. Override the location with TOKENROUTER_CONFIG.

paths:
  data_dir: data                      # SQLite DBs, diffs, candidate tiers
  tiers_file: config/tiers.yaml       # the live tier file LiteLLM loads
  aliases_file: config/aliases.yaml   # hand-kept OpenRouter <-> Artificial Analysis map

catalog:
  # Blended price = input_weight * input + output_weight * output (USD / 1M tokens)
  input_weight: 0.75
  output_weight: 0.25
  top_n: 3                            # primary + fallbacks kept per tier
  # Wait for `tokenrouter apply` after reviewing the diff (open question in the design).
  # D6: ratified by the design thread (phase1b).
  auto_apply: false
  # Each model joins only the highest tier it qualifies for, so moving a request up a
  # tier always buys a more capable model (with overlap, cheap strong models topped
  # both fast and balanced).
  # D2: ratified by the design thread (phase1b).
  exclusive_tiers: true
  # Artificial Analysis scores each reasoning-effort setting separately; the plain slug
  # is maximum effort. Score models at the first effort listed that exists, and call
  # them at that effort (reasoning_effort is sent for low/medium/high).
  # D3: ratified (phase1b). Single-score models get the Q2 normalization in N2 (todo).
  # Prefixes of local models, the only ones `extra_members` may list.
  local_model_prefixes: [ollama/]
  score_effort_preference: [medium, high, "", non-reasoning, low, xhigh, reasoning, thinking, adaptive, minimal, max]

# Tuned on the first real refresh (2026-10-16), on medium-effort scores: callable
# models' median 21.9, p90 41.1, max 52.6. The design's starting floors (25/40/55)
# left reasoning empty. Order matters: it is the escalation order.
# D1: ratified provisionally (phase1b); to be re-derived as p50/p75/p90 percentiles in N2.
tiers:
  fast:
    max_blended_price: 0.50
    min_quality: 25
    requires: {min_context: 32000}
  balanced:
    max_blended_price: 4.00
    min_quality: 38
    requires: {min_context: 128000, tools: true}
  reasoning:
    max_blended_price: null           # no ceiling
    min_quality: 48
    requires: {min_context: 128000, tools: true}

# Local models added to a tier after the ranked members. Only local models may be pinned
# (provider neutrality, N-T4: `tokenrouter audit` rejects anything else).
extra_members:
  fast:
    - litellm_name: ollama/qwen3:8b
      provider: ollama
      context_window: 40000
      supports_tools: true
      supports_json: true
      litellm_params: {api_base: "http://localhost:11434"}

decision:
  jev_model: jev-1.13.0               # pinned; logged per decision
  jev_timeout_s: 2.0
  default_tier: balanced              # Jev unavailable -> this tier
  # Choice confidence below the threshold -> escalate one tier up.
  confidence_thresholds: {fast: 0.6, balanced: 0.5, reasoning: 0.3}
  # Noul probability at or above which a flag counts as set.
  flag_threshold: 0.5
  sensitive_threshold: 0.8            # is_sensitive >= this -> human_review
  long_context_tokens: 200000         # needs_long_context -> require this window
  state_prompt_chars: 4000            # truncated prompt excerpt sent to Jev
  blocked_data_classes: [secrets, credentials]

execution:
  num_retries: 1
  timeout_s: 120
  max_output_tokens_default: 4096

# Per-project (per-agent) settings. `send_raw_prompt: false` sends Jev metadata + summary only.
# `baseline` is the model the agent uses today: cost reduction is measured against it
# (exit criterion: >= 40% cheaper than each agent's current model). There is no default
# baseline; an agent without one reports cost reduction as n/a. Prices are explicit because
# the pinned LiteLLM price map may not know the newest models. The Video Intelligence
# Pipeline agents get one entry each when the shadow run is set up (N5), e.g.
#   <agent project_id>:
#     baseline: {model: <litellm name>, input_usd_per_m: <x>, output_usd_per_m: <y>}
projects:
  default:
    monthly_budget_usd: null
    send_raw_prompt: true
